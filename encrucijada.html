<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFC - Encrucijadas y Detector de Disociación</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-col: #1e293b;
            --danger: #ef4444;
            --success: #22c55e;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 680px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid var(--border-col);
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-col);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .metric-card {
            background: #0b0f19;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-col);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .metric-card span { display: block; font-size: 1.1rem; font-weight: bold; color: var(--success); margin-top: 4px; }
        .scenario-box {
            background-color: #0b0f19;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-col);
            line-height: 1.6;
            font-size: 1rem;
        }
        .choices { display: flex; flex-direction: column; gap: 12px; }
        .choice-btn {
            background-color: #1e293b; color: var(--text-main); text-align: left; padding: 14px 16px;
            border-radius: 8px; cursor: pointer; border: 1px solid #334155; font-size: 0.95rem; transition: all 0.2s;
        }
        .choice-btn:hover { background-color: #334155; border-color: var(--accent); }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="user-info">
                <img id="avatarDisplay" alt="Avatar">
                <div>
                    <h4 id="lblUsuario" style="margin:0; font-size:0.95rem; color:var(--accent);">Usuario</h4>
                    <span id="lblRazon" style="font-size:0.7rem; color:var(--text-muted);">Empresa</span>
                </div>
            </div>
            <div style="font-size:0.8rem; background:#1e293b; padding:6px 12px; border-radius:6px; color:var(--accent);" id="lblPaso">Escena 1 de 2</div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">Armonía Familiar<span id="valArmonia">100%</span></div>
            <div class="metric-card">Eficiencia Operativa<span id="valOperativa">100%</span></div>
            <div class="metric-card">Continuidad / Sucesión<span id="valSucesoria">100%</span></div>
        </div>

        <div class="scenario-box" id="textoEscenario">
            Cargando escenario sistémico...
        </div>

        <div class="choices" id="contenedorOpciones">
            <!-- Dinámico -->
        </div>
    </div>

    <script>
        if (sessionStorage.getItem("efc_genograma_completado") !== "true") {
            window.location.href = "genograma.html";
        } else {
            document.getElementById("lblUsuario").innerText = sessionStorage.getItem("efc_usuario");
            document.getElementById("lblRazon").innerText = sessionStorage.getItem("efc_razon");
            document.getElementById("avatarDisplay").src = sessionStorage.getItem("efc_avatar");
            actualizarMetricasUI();
        }

        const escenarios = [
            {
                titulo: "Escenario I: Gobierno y Alianzas Domésticas",
                texto: "El directorio discute la incorporación formal de un pariente político sin experiencia operativa previa para calmar tensiones domésticas impulsadas por alianzas con terceros ajenos al negocio.",
                opciones: [
                    { texto: "Aceptar la incorporación priorizando la cohesión afectiva inmediata a corto plazo.", dArmonia: +5, dOp: -15, dSuc: -10, tipo: "cortoplacista" },
                    { texto: "Rechazar la contratación exigiendo rigurosamente meritocracia y estándares profesionales independientes.", dArmonia: -15, dOp: +10, dSuc: +10, tipo: "rigido" },
                    { texto: "Diseñar un protocolo condicionado de capacitación externa previa bajo evaluación estricta.", dArmonia: 0, dOp: +5, dSuc: +5, tipo: "estrategico" }
                ]
            },
            {
                titulo: "Escenario II: Operaciones, Calidad y Humedad en Planta",
                texto: "Se presenta una oportunidad de expansión de suministros con un margen financiero excelente, pero exige desviar recursos críticos y relajar los controles técnicos de granulometría y humedad.",
                opciones: [
                    { texto: "Aceptar de inmediato priorizando la rentabilidad financiera cortoplacista por sobre el estándar técnico.", dArmonia: 0, dOp: -20, dSuc: -10, tipo: "cortoplacista" },
                    { texto: "Rechazar el contrato para proteger rigurosamente los protocolos industriales de calidad.", dArmonia: 0, dOp: +10, dSuc: +5, tipo: "tecnico" },
                    { texto: "Renegociar plazos de entrega y escalar capacidad técnica sin colapsar la planta.", dArmonia: +5, dOp: +5, dSuc: +10, tipo: "estrategico" }
                ]
            }
        ];

        let indiceEscenario = parseInt(sessionStorage.getItem("efc_indice_escenario") || "0");

        function cargarEscenarioActual() {
            if (indiceEscenario >= escenarios.length) {
                window.location.href = "sucesion.html";
                return;
            }
            const esc = escenarios[indiceEscenario];
            document.getElementById("lblPaso").innerText = `Escena ${indiceEscenario + 1} de ${escenarios.length}`;
            document.getElementById("textoEscenario").innerHTML = `<strong>${esc.titulo}:</strong><br><br>${esc.texto}`;

            const contenedor = document.getElementById("contenedorOpciones");
            contenedor.innerHTML = "";

            esc.opciones.forEach((op, idx) => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerHTML = `<strong>Opción ${idx + 1}:</strong> ${op.texto}`;
                btn.onclick = () => registrarDecision(op);
                contenedor.appendChild(btn);
            });
        }

        function actualizarMetricasUI() {
            document.getElementById("valArmonia").innerText = sessionStorage.getItem("efc_armonia") + "%";
            document.getElementById("valOperativa").innerText = sessionStorage.getItem("efc_operativa") + "%";
            document.getElementById("valSucesoria").innerText = sessionStorage.getItem("efc_sucesoria") + "%";
        }

        function registrarDecision(op) {
            let armonia = Math.max(0, Math.min(100, parseInt(sessionStorage.getItem("efc_armonia")) + op.dArmonia));
            let operativa = Math.max(0, Math.min(100, parseInt(sessionStorage.getItem("efc_operativa")) + op.dOp));
            let sucesoria = Math.max(0, Math.min(100, parseInt(sessionStorage.getItem("efc_sucesoria")) + op.dSuc));
            let contradicciones = parseInt(sessionStorage.getItem("efc_contradicciones"));

            if (op.tipo === "cortoplacista") {
                contradicciones++;
            }

            let historial = JSON.parse(sessionStorage.getItem("efc_historial_decisiones") || "[]");
            historial.push({ escena: indiceEscenario + 1, eleccion: op.texto, tipo: op.tipo });

            sessionStorage.setItem("efc_armonia", armonia);
            sessionStorage.setItem("efc_operativa", operativa);
            sessionStorage.setItem("efc_sucesoria", sucesoria);
            sessionStorage.setItem("efc_contradicciones", contradicciones);
            sessionStorage.setItem("efc_historial_decisiones", JSON.stringify(historial));

            indiceEscenario++;
            sessionStorage.setItem("efc_indice_escenario", indiceEscenario);

            cargarEscenarioActual();
        }

        cargarEscenarioActual();
    </script>
</body>
</html>
